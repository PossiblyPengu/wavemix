name: Release

on:
  push:
    tags: ['v*']
  # Publish from the Actions tab (or the API) without pushing a tag: the release step creates it.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, matching Cargo.toml (for example 0.15.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Optional code-signing certificate: a base64 .pfx and its password, as repository secrets.
      # Without them the build still works, just unsigned.
      SIGN_PFX: ${{ secrets.SIGN_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Work out the version
        id: v
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $v = "${{ inputs.version }}" } else { $v = "${{ github.ref_name }}" }
          $v = $v.TrimStart('v')
          if ((Select-String -Path Cargo.toml -Pattern "^version = `"$v`"" -Quiet) -ne $true) { throw "Cargo.toml is not at version $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - run: cargo build --release
      - name: Find signtool
        if: env.SIGN_PFX != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX))
          $tool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -First 1
          "SIGNTOOL=$($tool.FullName)" >> $env:GITHUB_ENV
          "PFX=$pfx" >> $env:GITHUB_ENV
      - name: Sign the program
        if: env.SIGN_PFX != ''
        shell: pwsh
        env:
          SIGN_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f $env:PFX /p $env:SIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target\release\wavemix.exe
      - name: Build the installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $version = "${{ steps.v.outputs.version }}"
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DVERSION=$version" "/DEXE=$PWD\target\release\wavemix.exe" "/DOUT=$PWD\wavemix-setup-$version.exe" installer\wavemix.nsi
      - name: Sign the installer
        if: env.SIGN_PFX != ''
        shell: pwsh
        env:
          SIGN_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f $env:PFX /p $env:SIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem wavemix-setup-*.exe).FullName
      - name: Checksum
        shell: pwsh
        run: |
          # Beside the installer, so the app can check what it downloaded before running it.
          $version = "${{ steps.v.outputs.version }}"
          $hash = (Get-FileHash -Algorithm SHA256 "wavemix-setup-$version.exe").Hash.ToLower()
          "$hash  wavemix-setup-$version.exe" | Out-File -Encoding ascii "wavemix-setup-$version.exe.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Wavemix ${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: |
            wavemix-setup-*.exe
            wavemix-setup-*.exe.sha256
            target/release/wavemix.exe
