name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Build the installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DVERSION=$version" "/DEXE=$PWD\target\release\wavemix.exe" "/DOUT=$PWD\wavemix-setup-$version.exe" installer\wavemix.nsi
      - uses: softprops/action-gh-release@v2
        with:
          name: Wavemix ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            wavemix-setup-*.exe
            target/release/wavemix.exe
